<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 512" role="img" aria-labelledby="eks-platform-t eks-platform-d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif">
  <title id="eks-platform-t">Running EKS on Fargate</title>
  <desc id="eks-platform-d">The five steps: 1 Define. 2 One run, automatic. 3 Run on Fargate. 4 Platform extensions: traffic, logs and metrics. 5 Monthly patching.</desc>
  <defs><marker id="eks-platform-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#a9b1d8"/></marker></defs>
  <rect x="0" y="0" width="360" height="512" rx="16" fill="#070919"/>
  <text x="16" y="38" font-size="19" fill="#eef1ff" font-weight="700">Running EKS on Fargate</text>
  <text x="16" y="62" font-size="15" fill="#a9b1d8">A generic view of one cluster</text>
  <rect x="16" y="80" width="328" height="52" rx="12" fill="#10143a" stroke="#96a6ff" stroke-opacity="0.32" stroke-width="1.2"/>
  <text x="32" y="112" font-size="17" fill="#eef1ff" font-weight="700">1  Define</text>
  <line x1="180" y1="132" x2="180" y2="158" stroke="#a9b1d8" stroke-width="1.5" marker-end="url(#eks-platform-a)"/>
  <rect x="16" y="160" width="328" height="52" rx="12" fill="#10143a" stroke="#ffb94f" stroke-width="2"/>
  <text x="32" y="192" font-size="17" fill="#eef1ff" font-weight="700">2  One run</text>
  <text x="328" y="192" font-size="14" fill="#ffb94f" font-weight="700" text-anchor="end">AUTOMATIC</text>
  <line x1="180" y1="212" x2="180" y2="238" stroke="#a9b1d8" stroke-width="1.5" marker-end="url(#eks-platform-a)"/>
  <rect x="16" y="240" width="328" height="52" rx="12" fill="#10143a" stroke="#96a6ff" stroke-opacity="0.32" stroke-width="1.2"/>
  <text x="32" y="272" font-size="17" fill="#eef1ff" font-weight="700">3  Run on Fargate</text>
  <line x1="180" y1="292" x2="180" y2="318" stroke="#a9b1d8" stroke-width="1.5" marker-end="url(#eks-platform-a)"/>
  <rect x="16" y="320" width="328" height="88" rx="12" fill="#10143a" stroke="#96a6ff" stroke-opacity="0.32" stroke-width="1.2"/>
  <text x="32" y="350" font-size="17" fill="#eef1ff" font-weight="700">4  Platform extensions</text>
  <rect x="32" y="364" width="77" height="28" rx="14" fill="none" stroke="#5e98ff" stroke-width="1.4"/>
  <text x="70.5" y="383" font-size="15" fill="#eef1ff" text-anchor="middle">Traffic</text>
  <rect x="115" y="364" width="52" height="28" rx="14" fill="#0f2a24" stroke="#2ed8a7" stroke-width="1.4"/>
  <text x="141.0" y="383" font-size="15" fill="#eef1ff" text-anchor="middle">Logs</text>
  <rect x="173" y="364" width="77" height="28" rx="14" fill="none" stroke="#ffb94f" stroke-width="1.4"/>
  <text x="211.5" y="383" font-size="15" fill="#eef1ff" text-anchor="middle">Metrics</text>
  <line x1="180" y1="408" x2="180" y2="434" stroke="#a9b1d8" stroke-width="1.5" marker-end="url(#eks-platform-a)"/>
  <rect x="16" y="436" width="328" height="52" rx="12" fill="#10143a" stroke="#2ed8a7" stroke-width="2"/>
  <text x="32" y="468" font-size="17" fill="#eef1ff" font-weight="700">5  Monthly patching</text>
</svg>
