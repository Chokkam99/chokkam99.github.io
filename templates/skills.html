<section class="skills" aria-labelledby="skills-heading">
  <div class="skills-head">
    <h2 id="skills-heading" class="skills-title">Skills</h2>
    <p class="skills-hint">Pick one to see where I used it.</p>
    <a class="skills-all" href="/skills/">All skills</a>
  </div>
  <ul class="skill-chips">{{chips}}</ul>
  <div class="skill-card" id="skill-card" role="region" aria-labelledby="skill-card-title" hidden></div>
  <p class="visually-hidden" id="skill-status" aria-live="polite"></p>
  <script type="application/json" id="skills-data">{{data}}</script>
</section>
